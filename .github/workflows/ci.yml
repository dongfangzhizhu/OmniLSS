name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  tests:
    name: "${{ matrix.group.name }} / py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    env:
      # Codecov rejects tokenless uploads for a protected main; when the
      # repository has no CODECOV_TOKEN secret the upload step is skipped
      # instead of failing an otherwise green test job.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        group:
          - name: Group A Core Algorithms
            pattern: "tests/test_rs*.py tests/test_cg*.py tests/test_mixed*.py tests/test_fitting_jit*.py tests/test_distribution_registry_complete.py"
          - name: Group B R Consistency
            pattern: "tests/test_*r_consistency*.py tests/test_consistency_families.py tests/test_dpqr_r_consistency.py"
          - name: Group C Smooth Diagnostics Prediction
            pattern: "tests/test_smooth*.py tests/test_diagnostics*.py tests/test_prediction*.py tests/test_serialization*.py tests/test_grpc_server.py"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up R (Group B needs real R + gamlss)
        if: contains(matrix.group.name, 'R Consistency')
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
      - name: Install R packages for R-consistency group (pinned reference)
        if: contains(matrix.group.name, 'R Consistency')
        run: |
          # D2.308/R1: versions, URLs and SHA256 live in r-reference-lock.json.
          # This step only materialises and verifies them; it never floats to
          # CRAN latest.  A mirror_url in the lock is used if the primary fails.
          python tools/install_r_reference.py \
            --lock docs/development/r-reference-lock.json \
            --dest /tmp/r-reference > /tmp/r-reference-paths.txt
          mapfile -t R_REF_PKGS < /tmp/r-reference-paths.txt
          Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
          Rscript -e 'install.packages(commandArgs(TRUE), repos = NULL, type = "source")' "${R_REF_PKGS[@]}"
          Rscript -e 'stopifnot(
            packageDescription("gamlss.dist")$Version == "6.1-1",
            packageDescription("gamlss")$Version == "5.5-0"
          )'
          echo "R reference installed from lock: ${R_REF_PKGS[*]}"
      - run: pip install uv
      - name: Install dependencies (server extras for Group C grpc tests)
        run: |
          cd omnilss
          uv pip install --system -e ".[server,dev]"
      - name: Run grouped tests in parallel
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: |
          set -o pipefail
          cd omnilss
          python -m pytest -n auto ${{ matrix.group.pattern }} -v --cov=omnilss --cov-report=xml --cov-report=term 2>&1 | tee /tmp/grouped.log
      - name: Fail closed if R-consistency tests were skipped
        if: contains(matrix.group.name, 'R Consistency') && always() && !cancelled()
        run: |
          cd omnilss
          # D2.307: Group B has legitimate skips (vendored gamlss.* sources not
          # present, R non-convergence).  The old gate failed on ANY skip and
          # re-ran the whole 19-minute suite.  Parse the step-8 log instead and
          # fail only on the thing the gate is for: R unusable => mass skips.
          PASSED=$(grep -oE "[0-9]+ passed" /tmp/grouped.log | grep -oE "[0-9]+" | head -1)
          PASSED=${PASSED:-0}
          SKIPPED=$(grep -oE "[0-9]+ skipped" /tmp/grouped.log | grep -oE "[0-9]+" | head -1)
          SKIPPED=${SKIPPED:-0}
          if [ "$PASSED" -lt 300 ]; then
            echo "::error::R-consistency assertion count ${PASSED} < 300 (required floor)"
            exit 1
          fi
          if [ "$SKIPPED" -gt 50 ]; then
            echo "::error::R-consistency mass skips (${SKIPPED}) — R reference not usable"
            exit 1
          fi
          if grep -qE "Rscript.*(not found|No such file)|R is not available|R not usable" /tmp/grouped.log; then
            echo "::error::R-consistency tests could not execute against R"
            exit 1
          fi
          echo "OK: R-consistency ran against pinned R (passed=${PASSED}, skipped=${SKIPPED})"
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          file: ./omnilss/coverage.xml
          flags: ${{ matrix.group.name }}
          # Phase 4.5: coverage reporting failures fail the CI; the 0.70
          # project target in codecov.yml is enforced via the codecov status
          # check (required on main).
          fail_ci_if_error: true

  windows-cpu:
    name: "Windows CPU / py${{ matrix.python-version }}"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install package (core + optax for link tests)
        run: |
          cd omnilss
          uv pip install --system -e ".[dev]" optax
      - name: Verify JAX is CPU-only
        run: |
          python -c "import jax; devices = jax.devices(); print(devices); assert all(d.platform == 'cpu' for d in devices)"
      - name: Core CPU test subset (no R, no network)
        run: |
          set -o pipefail
          cd omnilss
          python -m pytest \
            tests/test_e02_release_blockers.py \
            tests/test_v01_public_api.py \
            tests/test_week2_numerical_stability.py \
            tests/test_serialization_json.py \
            tests/test_r_golden_fixture_no.py \
            tests/test_r_golden_fixture_ga.py \
            tests/test_r_golden_fixture_po.py \
            tests/test_r_golden_fixture_be.py \
            tests/test_r_golden_fixture_nbi.py \
            tests/test_r_golden_fixture_zaga.py \
            -q -rs | tee windows-cpu-tests.log
      - name: Fail closed if any Windows core test was skipped
        run: |
          if grep -qE "SKIPPED" omnilss/windows-cpu-tests.log; then
            echo "::error::Windows core tests were skipped; the subset must run fully"
            exit 1
          fi
          echo "OK: Windows core subset ran with zero skips"
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-tests-py${{ matrix.python-version }}
          path: omnilss/windows-cpu-tests.log
          if-no-files-found: warn

  collection-gate:
    name: Tiered Collection Gate (D0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install uv
      - name: Install dependencies (main + server/grpc extras)
        run: |
          cd omnilss
          uv pip install --system -e ".[server,dev]" optax
      - name: Tiered collection gate (four self-owned tiers)
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
          # D0.3: fail-closed by construction — the tool exits 0 only when every
          # selected tier collects with zero errors and at least one test.
          # --strict-skips (D7) additionally rejects collection-time skips, e.g. a
          # module-level importorskip silently hiding a suite; the dev extras are
          # installed above so hypothesis-backed property modules are collected.
          # Tiers: omnilss, omnilss-server, omnilss-pro, benchmarks.
          # ondil/ and gamlss-python/ are reference projects and are never tiers.
          set -o pipefail
          python tools/tiered_collection.py --mode collect --strict-skips --json | tee tiered-collection.json
      - name: Run omnilss-pro and omnilss-server test tiers
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
          python tools/tiered_collection.py --tier omnilss-pro --tier omnilss-server --mode run
      - name: Upload tiered collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiered-collection-report
          path: tiered-collection.json
      - name: Golden manifest gate (D0.2, template/manifest validation only)
        run: python tools/golden_manifest_gate.py --check
      - name: Milestone manifest gate (M0 evidence bundle in sync)
        run: python tools/milestone_manifest.py --check
      - name: High-frequency family freeze gate (P1-1)
        run: python tools/highfreq_family_freeze.py --check
      - name: P3-1 contract gate (family / link / formula / prediction)
        run: python tools/contract_freeze.py --check
      - name: M1 / M2 / M3 / M4 / P2 milestone and defect artifact gates
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
          python tools/m1_assessment.py --check
          python tools/m2_assessment.py --check
          python tools/m3_assessment.py --check
          python tools/m3_admission_evidence.py --check
          python tools/m4_scope_inventory.py --check
          python tools/m4_assessment.py --check
          python tools/p2_defect_classification.py --check
          python tools/p5_streaming_golden.py --check
      - name: P5-1b ondil contract artifact gate (when reference repo present)
        if: hashFiles('ondil/src/ondil/distributions/normal.py') != ''
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: python tools/ondil_contract_scan.py --check
      - name: Symbol coverage artifact freshness (D0.1, needs vendored R/)
        if: hashFiles('R/gamlss/NAMESPACE') != ''
        run: python tools/generate_symbol_coverage.py --check
      - name: Explain skipped R-dependent check
        if: hashFiles('R/gamlss/NAMESPACE') == ''
        run: |
          echo "R/ is vendored and gitignored, so CI has no R sources: the D0.1"
          echo "artifact freshness check runs where R/ is present (local/dev), and its"
          echo "pure-Python invariants are covered by tests/test_symbol_coverage_tool.py."
      - name: Coverage difference report / regression ratchet (D0.4)
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
          # Consumes the D0.1 per-symbol matrix, enumerates missing / placeholder /
          # compat_alias / evidence_gap (plus informational python-only "extra"),
          # and exits 1 when any ratchet category gains a symbol relative to
          # docs/development/symbol-coverage-baseline.json.
          python tools/coverage_diff_report.py --json --out coverage-diff.json | tee /tmp/coverage-diff.log
      - name: Upload coverage difference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-difference-report
          path: coverage-diff.json
          if-no-files-found: warn

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install uv
      - run: |
          cd omnilss
          uv pip install --system -e ".[dev]"
          uv pip install --system ruff black==26.10.1 mypy
      - run: |
          cd omnilss
          black --check src/omnilss/
      - run: |
          cd omnilss
          ruff check src/omnilss/ --select E,W,F --ignore E501
      - run: |
          cd omnilss
          mypy src/omnilss/ --ignore-missing-imports
        continue-on-error: true

  benchmark-smoke:
    name: Benchmark Smoke (no R/GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install uv
      - name: Install dependencies
        run: |
          cd omnilss
          uv pip install --system -e ".[dev]"
      - name: Run Python-only benchmark smoke
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
           python benchmarks/jax_rs_benchmark.py --suite no-r --smoke --families NO --n-values 100 --n-reps 2 --out-dir benchmarks/results/smoke

  tls-smoke:
    name: TLS Service Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install uv
      - run: pip install pyyaml
      - name: Install server dependencies
        run: |
          cd omnilss
          uv pip install --system -e ".[server,dev]"
      - name: Validate compose TLS overlay
        run: |
          python - <<'PY'
          import pathlib, yaml
          base = yaml.safe_load(pathlib.Path('docker-compose.yml').read_text())
          overlay = yaml.safe_load(pathlib.Path('docker-compose.tls.yml').read_text())
          assert 'omnilss-core-grpc' in overlay['services']
          assert 'omnilss-core-http' in overlay['services']
          assert 'OMNILSS_TLS_CERT' in overlay['services']['omnilss-core-grpc']['environment']
          assert 'OMNILSS_TLS_KEY' in overlay['services']['omnilss-core-grpc']['environment']
          assert '--ssl-certfile' in overlay['services']['omnilss-core-http']['environment']['OMNILSS_UVICORN_TLS_ARGS']
          print('TLS compose overlay validated')
          PY
      - name: Run TLS readiness and service smoke
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
          python -m pytest omnilss/tests/test_tls_readiness.py omnilss/tests/test_tls_support.py omnilss/tests/test_fastapi_uvicorn_tls.py -q
