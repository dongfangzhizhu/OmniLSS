name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.3.0)"
        required: true
        type: string

jobs:
  pre-release-gate:
    name: Pre-release gate (full tests + required-R fail-closed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R (required-R gate needs real R + gamlss)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'

      - name: Install R packages
        run: Rscript -e 'install.packages(c("gamlss", "gamlss.dist", "jsonlite"), repos = "https://cloud.r-project.org")'

      - run: pip install uv

      - name: Install dependencies (server + dev extras for tiered collection)
        run: |
          cd omnilss
          uv pip install --system -e ".[server,dev]"

      # P0-4 static release gates. The full suite no longer runs here in a single
      # process (that is the >1.5h, compaction-fragile pattern); it is split
      # across the 8 sharded-test jobs below instead.
      - name: Whitespace / conflict-marker gate (git diff --check)
        run: git diff --check

      - name: Tiered collection gate (zero errors, strict skips)
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: python tools/tiered_collection.py --mode collect --strict-skips --json

      - name: Shard manifest is deterministic and lossless
        run: python tools/pytest_shards.py --shards 8 --check
      - name: Milestone manifest gate (M0 evidence bundle in sync)
        run: python tools/milestone_manifest.py --check
      - name: High-frequency family freeze gate (P1-1)
        run: python tools/highfreq_family_freeze.py --check

      - name: Lint / type gate (ruff, black, mypy)
        run: |
          cd omnilss
          uv pip install --system ruff black mypy
          ruff check src/omnilss/ --select E,W,F --ignore E501
          black --check src/omnilss/
          # Advisory only (matches ci.yml): full-codebase mypy is not yet clean.
          mypy src/omnilss/ --ignore-missing-imports || echo "mypy: advisory"

      - name: Required-R gate (fail-closed, no skips)
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
        run: |
          cd omnilss
          python -m pytest "tests/test_*r_consistency*.py" -rs -q 2>&1 | tee /tmp/rcons.log
          if grep -qE "skipped|SKIPPED" /tmp/rcons.log; then
            echo "::error::Required-R tests were skipped; release blocked (Phase 4.5)"
            exit 1
          fi
          echo "OK: required-R tests executed against real R"

  # P0-4: full-suite release gate as 8 parallel shards. Whole-shard mode (one
  # pytest process per shard) so JAX/registry cold-compilation is paid once,
  # not once per file. Round-robin partition spreads the slow R-bridge files.
  # Each shard gets its OWN OMNILSS_MODEL_DB_PATH to avoid the concurrent
  # gRPC sqlite write lock (MEMORY.md D2.216); stdout is tee'd to a log file
  # so progress survives an interruption instead of living only in a buffer.
  sharded-suite:
    name: "Full suite shard ${{ matrix.shard }}/8"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd omnilss
          uv pip install --system -e ".[server,dev]"

      - name: Generate deterministic 8-shard manifests
        run: python tools/pytest_shards.py --shards 8 --out-dir tmp/release-shards

      - name: Run shard ${{ matrix.shard }}
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
          OMNILSS_MODEL_DB_PATH: ${{ github.workspace }}/tmp/model-db-shard-${{ matrix.shard }}.sqlite3
        run: |
          set -o pipefail
          python -m pytest @tmp/release-shards/shard${{ matrix.shard }}.txt \
            -q -W ignore -p no:cacheprovider --tb=line \
            2>&1 | tee tmp/shard-${{ matrix.shard }}.log

      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-log
          path: tmp/shard-${{ matrix.shard }}.log
          if-no-files-found: warn

  # Performance benchmarks use wall-clock 0.5s thresholds that are noisy under
  # parallel load (MEMORY.md). Re-run them alone, on an idle runner, so the
  # release gate checks correctness parity rather than a contended timer.
  benchmark-recheck:
    name: Performance benchmark (isolated single run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd omnilss
          uv pip install --system -e ".[dev]"
      - name: Performance benchmarks, single process
        env:
          MPLBACKEND: Agg
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"
          PYTHONPATH: omnilss/src
        run: |
          python -m pytest omnilss/tests/test_performance_benchmarks.py \
            -q -W ignore -p no:cacheprovider

  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install build twine protobuf grpcio-tools

      - name: Generate gRPC stubs
        run: |
          cd omnilss
          python tools/generate_grpc_stubs.py

      - name: Build package
        run: |
          cd omnilss
          python -m build

      - name: Check package
        run: |
          cd omnilss
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: omnilss/dist/

  test-install:
    name: Test installation
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package (Linux/Mac)
        if: runner.os != 'Windows'
        run: pip install dist/*.whl

      - name: Install package (Windows)
        if: runner.os == 'Windows'
        run: |
          $whl = Get-ChildItem dist -Filter "*.whl" | Select-Object -First 1
          pip install $whl.FullName
        shell: pwsh

      - name: Test import
        run: |
          python -c "import omnilss; print(omnilss.__version__)"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test-install, pre-release-gate, sharded-suite, benchmark-recheck]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  create-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -n "/## \[${VERSION#v}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md || echo "See CHANGELOG.md for release notes" > release_notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false
