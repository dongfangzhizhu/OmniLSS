syntax = "proto3";
package omnilss;

// Phase 8.1: service capability / version / health contract.
message CapabilityMatrixRequest {}
message CapabilityMatrixResponse {
  string matrix_json = 1;
  bool success = 2;
  string error = 3;
}

message RouteCapabilityRequest {
  string family = 1;
  string method = 2;
  bool strict = 3;
  string formula = 4;
  string sigma_formula = 5;
  string nu_formula = 6;
  string tau_formula = 7;
}

message RouteCapabilityResponse {
  string report_json = 1;
  bool success = 2;
  string error = 3;
}

message VersionRequest {}
message VersionResponse {
  string version = 1;
  string python_version = 2;
  string jax_version = 3;
  string x64_enabled = 4;
  bool success = 5;
  string error = 6;
}

message HealthRequest {}
message HealthResponse {
  string status = 1;      // "ok" | "degraded"
  int64 model_count = 2;
  bool success = 3;
  string error = 4;
}

service CapabilityService {
  rpc CapabilityMatrix(CapabilityMatrixRequest) returns (CapabilityMatrixResponse);
  rpc RouteCapability(RouteCapabilityRequest) returns (RouteCapabilityResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
